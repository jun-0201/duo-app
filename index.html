<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9e9e2">
<title>DUO3.0学習アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f5ef;--desk:#e9e9e2;--ink:#23262e;--ink-soft:#7d8077;
    --accent:#3a5fcd;--accent-soft:rgba(58,95,205,.12);
    --line:rgba(58,95,205,.22);--line-strong:rgba(58,95,205,.40);
    --card:rgba(255,255,255,.66);--red:#c6362b;--green:#2b7a4b;--rule:28px;
    --kyokasho:'Klee One','UD デジタル教科書体 NK-R','UD Digi Kyokasho NK-R','游教科書体','Yu Kyokasho',
               'Hiragino Mincho ProN','ヒラギノ明朝 ProN',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--desk);}
  body{font-family:var(--kyokasho);color:var(--ink);font-size:15px;line-height:var(--rule);
    -webkit-text-size-adjust:100%;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background-color:var(--paper);
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px),
      linear-gradient(to right, transparent 0 44px, rgba(198,54,43,.30) 44px 45.5px, transparent 45.5px 100%);
    padding:22px 18px calc(56px + env(safe-area-inset-bottom)) 54px;}

  .brand{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;}
  .brand h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.03em;line-height:var(--rule);}
  .brand .sub{font-size:12px;color:var(--ink-soft);}
  .backbtn{border:none;background:none;padding:0;margin:0 0 2px;font-family:inherit;
    font-size:15px;color:var(--accent);cursor:pointer;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px 14px;margin:0 0 14px;}
  .card h2{font-size:14px;font-weight:600;margin:0 0 9px;color:var(--accent);letter-spacing:.04em;}
  .card p.note{font-size:12px;color:var(--ink-soft);margin:0 0 9px;}

  button{font-family:var(--kyokasho);font-size:16px;}
  .btn{display:block;width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.8);color:var(--ink);text-align:left;cursor:pointer;
    margin-bottom:8px;line-height:1.5;}
  .btn:last-child{margin-bottom:0;}
  .btn:active{background:var(--accent-soft);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center;font-weight:600;}
  .btn.primary:active{background:#2c4aa6;}
  .btn.ghost{text-align:center;color:var(--accent);background:transparent;}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn .rt{float:right;color:var(--ink-soft);font-size:14px;}
  .row{display:flex;gap:8px;}
  .row .btn{margin-bottom:0;}
  .cnt{color:var(--ink-soft);font-size:13px;}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:9px;border:none;background:rgba(255,255,255,.8);color:var(--ink-soft);cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600;}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mode{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.8);
    padding:10px 11px;text-align:left;cursor:pointer;font-family:var(--kyokasho);}
  .mode .nm{display:block;font-size:16px;font-weight:600;line-height:1.4;}
  .mode .ds{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.5;}
  .mode.on{background:var(--accent);border-color:var(--accent);}
  .mode.on .nm,.mode.on .ds{color:#fff;}
  .mode.on .ds{opacity:.85;}
  .noaudio{font-size:11px;color:var(--ink-soft);margin:8px 0 0;}

  .acc{display:flex;align-items:center;width:100%;background:none;border:none;padding:0;
    cursor:pointer;font-family:var(--kyokasho);color:var(--accent);font-size:14px;
    font-weight:600;letter-spacing:.04em;}
  .acc .tri{display:inline-block;margin-right:6px;font-size:11px;transition:transform .18s;}
  .acc.open .tri{transform:rotate(90deg);}
  .acc .n{margin-left:auto;color:var(--ink-soft);font-weight:400;font-size:13px;}
  .accbody{margin-top:11px;}
  .accbody[hidden]{display:none;}
  .numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .numgrid button{padding:9px 0;border:1px solid var(--line);border-radius:7px;
    background:rgba(255,255,255,.85);color:var(--ink);font-family:var(--kyokasho);
    font-size:16px;cursor:pointer;}
  .numgrid button:active{background:var(--accent-soft);}

  .senlist{margin-top:4px;}
  .senrow{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:9px 4px;
    border:none;border-bottom:1px solid var(--line);background:none;
    font-family:var(--kyokasho);cursor:pointer;}
  .senrow:last-child{border-bottom:none;}
  .senrow:active{background:var(--accent-soft);}
  .senrow .no{color:var(--accent);font-size:13px;min-width:2.6em;}
  .senrow .tx{color:var(--ink);font-size:14px;line-height:1.6;}

  .checks{display:flex;flex-wrap:wrap;gap:7px;}
  .checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
    border-radius:7px;padding:6px 9px;font-size:14px;background:rgba(255,255,255,.8);}
  .checks input{width:16px;height:16px;accent-color:var(--accent);}
  .rangebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rangebox input[type=number]{width:72px;padding:8px;border:1px solid var(--line);
    border-radius:7px;font-size:16px;font-family:var(--kyokasho);
    background:rgba(255,255,255,.9);color:var(--ink);}
  .rangebox button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;
    background:rgba(255,255,255,.8);color:var(--accent);cursor:pointer;}

  .qmeta{display:flex;font-size:12px;color:var(--ink-soft);}
  .qmeta .right{margin-left:auto;}
  .bar-progress{height:2px;background:var(--line);margin:2px 0 14px;overflow:hidden;}
  .bar-progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}

  .jp{font-size:14px;color:var(--ink-soft);margin:0 0 10px;}
  .en{font-size:19px;line-height:56px;overflow-wrap:break-word;}
  .en.plain{line-height:1.9;}
  .blankwrap{position:relative;display:inline-block;}
  input.blank{font-family:var(--kyokasho);font-size:19px;line-height:1.4;border:none;
    border-bottom:2px solid var(--accent);background:transparent;color:var(--ink);
    padding:0 2px;width:6ch;text-align:center;border-radius:0;-webkit-appearance:none;}
  input.blank:focus{outline:none;background:var(--accent-soft);border-bottom-color:#2c4aa6;}
  .filledword{display:inline-block;padding:0 2px;border-bottom:2px solid var(--line-strong);
    min-width:2ch;text-align:center;}
  .filledword.empty{min-width:6ch;}
  .mark{position:absolute;left:-8px;top:1px;width:13px;height:13px;color:var(--red);pointer-events:none;}
  .corr{position:absolute;left:6px;top:-13px;font-size:13px;line-height:1.2;color:var(--red);
    white-space:nowrap;font-family:var(--kyokasho);pointer-events:none;}

  .qactions{margin-top:20px;}
  .audiobtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.85);border-radius:999px;padding:7px 15px;color:var(--accent);
    cursor:pointer;font-size:15px;font-family:var(--kyokasho);}
  .audiobtn:active{background:var(--accent-soft);}
  .speed{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .speed .lb{font-size:12px;color:var(--ink-soft);}
  .speedseg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .speedseg button{padding:5px 11px;border:none;background:rgba(255,255,255,.85);
    color:var(--ink-soft);font-size:13px;font-family:var(--kyokasho);cursor:pointer;}
  .speedseg button.on{background:var(--accent);color:#fff;font-weight:600;}
  .toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.85);border-radius:999px;padding:6px 13px;color:var(--accent);
    font-size:13px;font-family:var(--kyokasho);cursor:pointer;margin-top:14px;}

  .dictbox{width:100%;min-height:96px;padding:10px;border:1px solid var(--line);
    border-radius:8px;background:rgba(255,255,255,.9);font-family:var(--kyokasho);
    font-size:17px;line-height:1.9;color:var(--ink);resize:vertical;}
  .dictbox:focus{outline:none;border-color:var(--accent);}
  .ansblock{margin-top:14px;font-size:17px;line-height:1.9;}
  .ansblock .lb{font-size:12px;color:var(--ink-soft);display:block;line-height:1.6;}
  .ansblock .wrong{color:var(--red);}

  .verdict{font-size:15px;font-weight:600;margin-top:14px;}
  .verdict.ok{color:var(--green);}
  .verdict.ng{color:var(--red);}

  .score{font-size:32px;font-weight:600;line-height:1.2;color:var(--accent);}
  .score small{font-size:15px;color:var(--ink-soft);margin-left:6px;font-weight:400;}
  .misslist{margin:0;padding:0;list-style:none;}
  .misslist li{border-top:1px solid var(--line);padding:9px 0;font-size:14px;line-height:1.7;}
  .misslist li:first-child{border-top:none;}
  .misslist .s{color:var(--ink);}
  .misslist .yours{color:var(--ink-soft);}
  .misslist .ans{color:var(--red);}

  .loading{color:var(--ink-soft);font-size:14px;padding:24px 0;}
  .empty{color:var(--ink-soft);font-size:13px;margin:0;}
  .hide{display:none !important;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;
    vertical-align:-2px;margin-right:7px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none;}.bar-progress i,.acc .tri{transition:none;}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">

  <button class="backbtn hide" id="backBtn">‹ 戻る</button>
  <div class="brand"><h1 id="title">DUO3.0学習アプリ</h1><span class="sub" id="subtitle"></span></div>

  <!-- ========== メニュー ========== -->
  <div id="scMenu">
    <div id="menuLoading" class="loading"><span class="spin"></span>セクションを検索中</div>
    <div id="menuBody" class="hide">

      <div class="card">
        <h2>学習モード</h2>
        <div class="modes" id="modeGrid">
          <button class="mode on" data-mode="fill"><span class="nm">穴埋め</span><span class="ds">空欄に単語を入力</span></button>
          <button class="mode" data-mode="listen"><span class="nm">リスニング</span><span class="ds">聞いて意味をつかむ</span></button>
          <button class="mode" data-mode="shadow"><span class="nm">シャドーイング</span><span class="ds">音に重ねて音読</span></button>
          <button class="mode" data-mode="dict"><span class="nm">ディクテーション</span><span class="ds">聞いて書き取る</span></button>
        </div>
        <p class="noaudio hide" id="audioNote">音声のある例文だけが出題されます。</p>
      </div>

      <div class="card">
        <h2>出題順</h2>
        <div class="seg" id="orderSeg">
          <button data-order="seq" class="on">順番</button>
          <button data-order="rand">ランダム</button>
        </div>
      </div>

      <div class="card">
        <button class="acc" id="secAcc" aria-expanded="false"><span class="tri">▶</span>セクション<span class="n" id="secCount"></span></button>
        <div class="accbody" id="secBody" hidden>
          <div class="numgrid" id="sectionList"></div>
          <p class="empty hide" id="noSection">data フォルダに section01.csv を置くと、ここに表示されます。</p>
        </div>
      </div>

      <div class="card">
        <h2>その他</h2>
        <button class="btn" id="toTest">定期テスト（複数セクション）<span class="rt">›</span></button>
        <button class="btn" id="toWeak">苦手問題<span class="rt" id="weakCount">0問</span></button>
        <button class="btn" id="toRecords">学習記録<span class="rt">›</span></button>
      </div>
    </div>
  </div>

  <!-- ========== 定期テスト ========== -->
  <div id="scTest" class="hide">
    <div class="card">
      <h2>範囲で選択</h2>
      <div class="rangebox">
        <input type="number" id="rangeFrom" min="1" max="80" placeholder="1">
        <span>〜</span>
        <input type="number" id="rangeTo" min="1" max="80" placeholder="5">
        <button id="applyRange">この範囲を選択</button>
      </div>
    </div>
    <div class="card">
      <h2>個別に選択</h2>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn ghost" id="checkAll">全選択</button>
        <button class="btn ghost" id="checkNone">全解除</button>
      </div>
      <div class="checks" id="testChecks"></div>
    </div>
    <button class="btn primary" id="startTest">開始</button>
  </div>

  <!-- ========== 例文一覧 ========== -->
  <div id="scSentences" class="hide">
    <div id="senLoading" class="loading"><span class="spin"></span>音声を確認中</div>
    <div id="senBody" class="hide">
      <div class="card">
        <h2 id="senSecName"></h2>
        <button class="btn primary" id="playAll">最初から通して</button>
      </div>
      <div class="card">
        <h2>例文をえらぶ</h2>
        <div class="senlist" id="senList"></div>
        <p class="empty hide" id="noSen">このセクションには音声がありません。</p>
      </div>
    </div>
  </div>

  <!-- ========== 穴埋め ========== -->
  <div id="scQuiz" class="hide">
    <div class="qmeta"><span id="qWhere"></span><span class="right" id="qCount"></span></div>
    <div class="bar-progress"><i id="qBar"></i></div>
    <div class="card">
      <div class="jp" id="qJa"></div>
      <div class="en" id="qEn"></div>
      <div id="qVerdict"></div>
      <div class="qactions"><button class="audiobtn hide" id="qPlay">▶ 例文を再生</button></div>
    </div>
    <button class="btn primary" id="checkBtn">答え合わせ</button>
    <button class="btn primary hide" id="nextBtn">次へ</button>
    <button class="btn ghost" id="quitBtn">中断してメニューに戻る</button>
  </div>

  <!-- ========== リスニング / シャドーイング ========== -->
  <div id="scPlay" class="hide">
    <div class="qmeta"><span id="pWhere"></span><span class="right" id="pCount"></span></div>
    <div class="bar-progress"><i id="pBar"></i></div>
    <div class="card">
      <div class="jp hide" id="pJa"></div>
      <div class="en plain hide" id="pEn"></div>
      <div class="qactions"><button class="audiobtn" id="pPlay">▶ 再生</button></div>
      <div class="speed"><span class="lb">速さ</span>
        <div class="speedseg" id="pSpeed">
          <button data-sp="0.75">0.75</button><button data-sp="1" class="on">1.0</button><button data-sp="1.25">1.25</button>
        </div>
      </div>
      <div><button class="toggle" id="pToggle">日本語を見る</button></div>
    </div>
    <button class="btn primary" id="pNext">次へ</button>
    <button class="btn ghost" id="pQuit">中断してメニューに戻る</button>
  </div>

  <!-- ========== ディクテーション ========== -->
  <div id="scDict" class="hide">
    <div class="qmeta"><span id="dWhere"></span><span class="right" id="dCount"></span></div>
    <div class="bar-progress"><i id="dBar"></i></div>
    <div class="card">
      <div class="qactions" style="margin-top:0;"><button class="audiobtn" id="dPlay">▶ 再生</button></div>
      <div class="speed" style="margin-bottom:14px;"><span class="lb">速さ</span>
        <div class="speedseg" id="dSpeed">
          <button data-sp="0.75">0.75</button><button data-sp="1" class="on">1.0</button><button data-sp="1.25">1.25</button>
        </div>
      </div>
      <textarea class="dictbox" id="dInput" placeholder="聞こえた英文を入力"
        autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>
      <div id="dResult"></div>
    </div>
    <button class="btn primary" id="dCheck">答え合わせ</button>
    <button class="btn primary hide" id="dNext">次へ</button>
    <button class="btn ghost" id="dQuit">中断してメニューに戻る</button>
  </div>

  <!-- ========== 結果 ========== -->
  <div id="scResult" class="hide">
    <div class="card">
      <h2 id="resWhere"></h2>
      <div class="score" id="resScoreBox"><span id="resScore">0</span><small id="resTotal"></small></div>
      <p class="note hide" id="resDone">おつかれさま。ここまでです。</p>
    </div>
    <div class="card" id="resMissCard">
      <h2>間違えた問題</h2>
      <ul class="misslist" id="resMiss"></ul>
    </div>
    <button class="btn primary" id="saveCsvBtn">学習記録をCSVで保存</button>
    <button class="btn ghost" id="againBtn">もう一度</button>
    <button class="btn ghost" id="homeBtn">メニューに戻る</button>
  </div>

  <!-- ========== 学習記録 ========== -->
  <div id="scRecords" class="hide">
    <div class="card">
      <h2>セクション別の学習記録</h2>
      <p class="note">1回練習を終えるごとに1件ずつ記録されます。</p>
      <div id="recList"></div>
      <p class="empty hide" id="noRec">まだ記録はありません。</p>
    </div>
  </div>

</div>

<script>
"use strict";

var DATA_DIR="data", AUDIO_DIR="audio", MAX_SECTION=80, BATCH=10;
var LS_WEAK={fill:"duo_weak", dict:"duo_weak_dict"};
var LS_LOG="duo_log_", LS_SPEED="duo_speed", LS_ACC="duo_secopen";
var MODE_NAME={fill:"穴埋め", listen:"リスニング", shadow:"シャドーイング", dict:"ディクテーション"};

function $(id){ return document.getElementById(id); }
function pad2(n){ return (n<10?"0":"")+n; }
function pad3(n){ n=String(n); while(n.length<3) n="0"+n; return n; }
function bust(){ return "?v="+Date.now(); }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function stamp(){ var d=new Date(); return ""+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function isAudioMode(m){ return m==="listen"||m==="shadow"||m==="dict"; }

function decodeBuf(buf){
  var t;
  try{ t=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch(e){ try{ t=new TextDecoder("shift_jis").decode(buf); }catch(e2){ t=new TextDecoder("utf-8").decode(buf); } }
  if(t.charCodeAt(0)===0xFEFF) t=t.slice(1);
  return t;
}
function parseCSV(text){
  var rows=[],row=[],field="",q=false,i,c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(field); field=""; }
      else if(c==="\r"){}
      else if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else field+=c;
    }
  }
  if(field!==""||row.length){ row.push(field); rows.push(row); }
  return rows;
}
var JP_RE=/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/;
function normalizeRow(r){
  if(r.length===5) return r;
  if(r.length<5) return null;
  var head=r.slice(0,3), rest=r.slice(3), idx=-1, i;
  for(i=0;i<rest.length;i++){ if(JP_RE.test(rest[i])){ idx=i; break; } }
  if(idx<=0) idx=rest.length-1;
  return [head[0],head[1],head[2], rest.slice(0,idx).join(","), rest.slice(idx).join(",")];
}
function splitBlanks(s){
  var tokens=[],blanks=[],re=/【([^】]*)】/g,last=0,m;
  while((m=re.exec(s))!==null){
    if(m.index>last) tokens.push({t:"text",v:s.slice(last,m.index)});
    tokens.push({t:"blank",v:m[1].trim(),i:blanks.length});
    blanks.push(m[1].trim());
    last=m.index+m[0].length;
  }
  if(last<s.length) tokens.push({t:"text",v:s.slice(last)});
  return {tokens:tokens, blanks:blanks};
}
function plainEn(s){ return s.replace(/【/g,"").replace(/】/g,"").replace(/\s+/g," ").trim(); }
function norm(s){
  return String(s||"").replace(/[\u2018\u2019\u02BC]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/\s+/g," ").trim().toLowerCase();
}
function words(s){
  return norm(s).replace(/[.,!?;:"()\u2014\u2013]/g," ").replace(/\s+/g," ").trim().split(" ")
    .filter(function(w){ return w!==""; });
}

function exists(url){
  return fetch(url,{method:"HEAD",cache:"no-store"}).then(function(r){return r.ok;}).catch(function(){return false;});
}
var sectionCache={}, audioCache={};
function loadSection(no){
  if(sectionCache[no]) return Promise.resolve(sectionCache[no]);
  var p;
  if(window.EMBEDDED && window.EMBEDDED[no]) p=Promise.resolve(window.EMBEDDED[no]);
  else{
    p=fetch(DATA_DIR+"/section"+pad2(no)+".csv"+bust(),{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("読み込めません: section"+pad2(no)+".csv");
      return r.arrayBuffer();
    }).then(function(b){ return decodeBuf(b); });
  }
  return p.then(function(text){
    var rows=parseCSV(text), out=[], i, r, en, sb;
    for(i=0;i<rows.length;i++){
      r=normalizeRow(rows[i]);
      if(!r) continue;
      if(!/\d/.test(r[0])) continue;
      en=r[3]||"";
      if(en.indexOf("【")<0) continue;
      sb=splitBlanks(en);
      if(!sb.blanks.length) continue;
      out.push({sec:parseInt(r[0],10), sen:parseInt(r[1],10), word:String(r[2]).trim(),
                en:en, ja:(r[4]||"").trim(), tokens:sb.tokens, blanks:sb.blanks});
    }
    sectionCache[no]=out;
    return out;
  });
}
function sentencesOf(items){
  var seen={}, out=[];
  items.forEach(function(it){
    var k=it.sec+"_"+it.sen;
    if(seen[k]) return;
    seen[k]=1;
    out.push({sec:it.sec, sen:it.sen, en:plainEn(it.en), ja:it.ja});
  });
  out.sort(function(a,b){ return a.sec-b.sec || a.sen-b.sen; });
  return out;
}
function audioUrl(sec,sen){ return AUDIO_DIR+"/"+pad2(sec)+"_"+pad3(sen)+".mp3"; }
function filterWithAudio(list){
  var out=[];
  function step(i){
    if(i>=list.length) return Promise.resolve();
    var batch=list.slice(i,i+BATCH);
    return Promise.all(batch.map(function(s){
      var k=s.sec+"_"+s.sen;
      if(audioCache[k]!==undefined) return Promise.resolve(audioCache[k]&&out.push(s));
      return exists(audioUrl(s.sec,s.sen)+bust()).then(function(ok){
        audioCache[k]=ok;
        if(ok) out.push(s);
      });
    })).then(function(){ return step(i+BATCH); });
  }
  return step(0).then(function(){
    out.sort(function(a,b){ return a.sec-b.sec || a.sen-b.sen; });
    return out;
  });
}

function loadJSON(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ alert("保存できませんでした。"); } }
function weakKeyOf(mode,sec,id){ return mode==="dict" ? sec+"_S"+id : sec+"_"+id; }
function weakList(mode){ return loadJSON(LS_WEAK[mode]||LS_WEAK.fill, []); }
function weakAdd(mode,sec,id){
  var k=weakKeyOf(mode,sec,id), w=weakList(mode), i;
  for(i=0;i<w.length;i++) if(w[i].k===k) return;
  w.push({k:k,sec:sec,id:id});
  saveJSON(LS_WEAK[mode], w);
}
function weakRemove(mode,sec,id){
  var k=weakKeyOf(mode,sec,id), w=weakList(mode), out=[];
  w.forEach(function(x){ if(x.k!==k) out.push(x); });
  saveJSON(LS_WEAK[mode], out);
}
function sectionLog(sec){ return loadJSON(LS_LOG+sec, []); }
function pushSectionLog(sec, sess){
  var log=sectionLog(sec), n=0;
  log.forEach(function(s){ if((s.mode||"fill")===sess.mode) n++; });
  sess.attempt=n+1;
  log.push(sess);
  saveJSON(LS_LOG+sec, log);
}

var player=null;
function stopAudio(){ if(player){ try{ player.pause(); }catch(e){} player=null; } }
function playAudio(url){
  stopAudio();
  player=new Audio(url);
  player.playbackRate=state.speed;
  if("preservesPitch" in player) player.preservesPitch=true;
  if("webkitPreservesPitch" in player) player.webkitPreservesPitch=true;
  player.play().catch(function(){});
}

function findSections(){
  if(window.EMBEDDED) return Promise.resolve(Object.keys(window.EMBEDDED).map(Number).sort(function(a,b){return a-b;}));
  var nums=[],i,found=[];
  for(i=1;i<=MAX_SECTION;i++) nums.push(i);
  function step(s){
    if(s>=nums.length) return Promise.resolve();
    return Promise.all(nums.slice(s,s+BATCH).map(function(n){
      return exists(DATA_DIR+"/section"+pad2(n)+".csv"+bust()).then(function(ok){ if(ok) found.push(n); });
    })).then(function(){ return step(s+BATCH); });
  }
  return step(0).then(function(){ found.sort(function(a,b){return a-b;}); return found; });
}

function loadingOn(on){
  $("menuLoading").classList.toggle("hide", !on);
  if(on) $("menuLoading").innerHTML='<span class="spin"></span>読み込み中';
}

function chooseSection(n){
  loadingOn(true);
  loadSection(n).then(function(items){
    if(state.mode==="fill"){
      loadingOn(false);
      if(!items.length){ alert("セクション"+n+"に問題が見つかりませんでした。"); return; }
      startFill(items, "セクション"+n, [n], function(){ chooseSection(n); });
      return;
    }
    loadingOn(false);
    openSentenceList(n, sentencesOf(items));
  }).catch(function(e){ loadingOn(false); alert(e.message||"読み込みに失敗しました。"); });
}

function openSentenceList(sec, list){
  show("scSentences", MODE_NAME[state.mode], "", goMenu);
  $("senLoading").classList.remove("hide");
  $("senBody").classList.add("hide");
  filterWithAudio(list).then(function(ok){
    $("senLoading").classList.add("hide");
    $("senBody").classList.remove("hide");
    $("senSecName").textContent="セクション"+sec;
    $("noSen").classList.toggle("hide", ok.length>0);
    $("playAll").classList.toggle("hide", ok.length===0);
    var host=$("senList");
    host.innerHTML="";
    ok.forEach(function(s,i){
      var b=document.createElement("button");
      b.className="senrow";
      b.innerHTML='<span class="no">'+pad2(s.sen)+'</span><span class="tx">'+esc(s.ja)+'</span>';
      b.onclick=function(){ startAudioMode(ok.slice(i), "セクション"+sec, [sec], function(){ openSentenceList(sec,list); }); };
      host.appendChild(b);
    });
    $("playAll").onclick=function(){
      var q=ok.slice();
      if(state.order==="rand") shuffle(q);
      startAudioMode(q, "セクション"+sec, [sec], function(){ openSentenceList(sec,list); });
    };
  });
}

function startFill(items, label, secs, again){
  state.queue = state.order==="rand" ? shuffle(items.slice()) : items.slice();
  state.secsInPlay=secs; state.label=label; state.lastSetup=again;
  state.index=0; state.answers=[];
  show("scQuiz", label, MODE_NAME.fill, function(){ if(confirm("練習を中断してメニューに戻りますか？")) goMenu(); });
  renderFill();
}
function startAudioMode(list, label, secs, again){
  if(!list.length){ alert("音声のある例文がありません。"); return; }
  state.queue=list.slice(); state.secsInPlay=secs; state.label=label; state.lastSetup=again;
  state.index=0; state.answers=[];
  var back=function(){ stopAudio(); if(confirm("中断してメニューに戻りますか？")) goMenu(); };
  if(state.mode==="dict"){ show("scDict",label,MODE_NAME.dict,back); renderDict(); }
  else{ show("scPlay",label,MODE_NAME[state.mode],back); renderPlay(); }
}

/* ---------- 穴埋め ---------- */
function renderFill(){
  var q=state.queue[state.index];
  state.graded=false;
  $("qWhere").textContent="セクション"+q.sec+" ・ 例文"+q.sen;
  $("qCount").textContent=(state.index+1)+" / "+state.queue.length;
  $("qBar").style.width=(state.index/state.queue.length*100)+"%";
  $("qJa").textContent=q.ja;
  $("qVerdict").innerHTML="";
  $("checkBtn").classList.remove("hide");
  $("nextBtn").classList.add("hide");
  var host=$("qEn"); host.innerHTML="";
  q.tokens.forEach(function(t){
    if(t.t==="text"){ host.appendChild(document.createTextNode(t.v)); return; }
    var wrap=document.createElement("span"); wrap.className="blankwrap";
    var inp=document.createElement("input");
    inp.className="blank"; inp.type="text";
    inp.setAttribute("inputmode","text"); inp.setAttribute("autocapitalize","off");
    inp.setAttribute("autocorrect","off"); inp.setAttribute("autocomplete","off");
    inp.setAttribute("spellcheck","false"); inp.setAttribute("enterkeyhint","next");
    inp.addEventListener("input",function(){ this.style.width=Math.max(6,this.value.length+1)+"ch"; });
    inp.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); focusNext(this); } });
    wrap.appendChild(inp); host.appendChild(wrap);
  });
  var btn=$("qPlay"); btn.classList.add("hide"); btn.onclick=null;
  var url=audioUrl(q.sec,q.sen);
  exists(url+bust()).then(function(ok){
    if(!ok || state.queue[state.index]!==q) return;
    btn.classList.remove("hide");
    btn.onclick=function(){ playAudio(url); };
  });
}
function focusNext(el){
  var all=Array.prototype.slice.call($("qEn").querySelectorAll("input.blank"));
  var next=all[all.indexOf(el)+1]||all[0];
  if(next) next.focus();
}
function gradeFill(){
  if(state.graded) return;
  var q=state.queue[state.index];
  var inputs=Array.prototype.slice.call($("qEn").querySelectorAll("input.blank"));
  var typed=inputs.map(function(i){ return i.value; });
  var res=typed.map(function(v,i){ return norm(v)===norm(q.blanks[i]); });
  var allOk=res.every(function(x){ return x; });
  state.graded=true;
  inputs.forEach(function(inp,i){
    var wrap=inp.parentNode, span=document.createElement("span");
    span.className="filledword"+(typed[i].trim()===""?" empty":"");
    span.textContent=typed[i];
    wrap.innerHTML=""; wrap.appendChild(span);
    if(res[i]){
      wrap.insertAdjacentHTML("beforeend",
        '<svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1"/></svg>');
    }else{
      wrap.insertAdjacentHTML("beforeend",
        '<svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.6 6.6 L4.4 9.4 L10.4 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        +'<span class="corr">'+esc(q.blanks[i])+'</span>');
    }
  });
  var v=$("qVerdict");
  v.className="verdict "+(allOk?"ok":"ng");
  v.textContent=allOk?"正解":"不正解";
  if(allOk) weakRemove("fill",q.sec,q.word); else weakAdd("fill",q.sec,q.word);
  state.answers.push({sec:q.sec, sen:q.sen, word:q.word, ok:allOk,
    typed: allOk?"":typed.join(" / "), correct: allOk?"":q.blanks.join(" / ")});
  $("checkBtn").classList.add("hide");
  $("nextBtn").classList.remove("hide");
  $("qBar").style.width=((state.index+1)/state.queue.length*100)+"%";
}

function renderDict(){

  $("dCount").textContent=(state.index+1)+" / "+state.queue.length;

  $("dNext").classList.add("hide");
  markSpeed($("dSpeed"));
  $("dPlay").onclick=function(){ playAudio(audioUrl(q.sec,q.sen)); };

function lcsMark(userWords, ansWords){
  var n=userWords.length, m=ansWords.length, i, j;
  var dp=[];
  for(i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); }
  for(i=1;i<=n;i++) for(j=1;j<=m;j++)
    dp[i][j] = userWords[i-1]===ansWords[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  var keepU=new Array(n).fill(false), keepA=new Array(m).fill(false);
  i=n; j=m;
  while(i>0&&j>0){
    if(userWords[i-1]===ansWords[j-1]){ keepU[i-1]=true; keepA[j-1]=true; i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--;
    else j--;
  }
  return {keep:keepU, keepAns:keepA, same:dp[n][m]};
}
function paintDiff(text, keep){
  var toks=String(text).split(/(\s+)/), wi=0, html="";
  toks.forEach(function(tk){
    if(tk==="") return;
    if(/^\s+$/.test(tk)){ html+=esc(tk); return; }
    if(!/[0-9A-Za-z\u00C0-\u024F]/.test(tk)){ html+=esc(tk); return; }
    html += keep[wi] ? esc(tk) : '<span class="wrong">'+esc(tk)+'</span>';
    wi++;
  });
  return html;
}
function gradeDict(){
  if(state.graded) return;
  var q=state.queue[state.index];
  var raw=$("dInput").value;
  var uw=words(raw), aw=words(q.en);
  var ok = uw.join(" ")===aw.join(" ");
  state.graded=true;
  var mk=lcsMark(uw,aw);
  var html=paintDiff(raw, mk.keep);
  var ansHtml=paintDiff(q.en, mk.keepAns);
  if(raw.trim()==="") html='<span class="wrong">（未入力）</span>';
  var diff=Math.max(uw.length,aw.length)-mk.same;
  $("dInput").disabled=true;
  $("dResult").innerHTML=
    '<div class="ansblock"><span class="lb">正しい英文</span>'+ansHtml+'</div>'+
    '<div class="ansblock"><span class="lb">入力した英文</span>'+html+'</div>'+
    '<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解（"+diff+"か所ちがい）")+'</div>';
  if(ok) weakRemove("dict",q.sec,q.sen); else weakAdd("dict",q.sec,q.sen);
  state.answers.push({sec:q.sec, sen:q.sen, word:"", ok:ok,
    typed: ok?"":raw.trim(), correct: ok?"":q.en});
  $("dCheck").classList.add("hide");
  $("dNext").classList.remove("hide");
  $("dBar").style.width=((state.index+1)/state.queue.length*100)+"%";
}

/* ---------- 進行 ---------- */
function nextQuestion(){
  stopAudio();
  state.index++;
  if(state.index>=state.queue.length){ finish(); return; }
  if(state.mode==="fill") renderFill();
  else if(state.mode==="dict") renderDict();
  else renderPlay();
}
function finish(){
  var scored=(state.mode==="fill"||state.mode==="dict");
  var lastSecs=[];
  if(scored){
    var bySec={};
    state.answers.forEach(function(a){ (bySec[a.sec]=bySec[a.sec]||[]).push(a); });
    lastSecs=Object.keys(bySec).map(Number).sort(function(a,b){return a-b;});
    var d=todayStr();
    lastSecs.forEach(function(sec){ pushSectionLog(sec,{date:d, mode:state.mode, items:bySec[sec]}); });
  }
  finishedSecs=lastSecs;
  $("resWhere").textContent=state.label+"（"+MODE_NAME[state.mode]+"）";
  $("resScoreBox").classList.toggle("hide", !scored);
  $("resDone").classList.toggle("hide", scored);
  $("saveCsvBtn").classList.toggle("hide", !scored);
  $("resMissCard").classList.add("hide");
  if(scored){
    var ok=state.answers.filter(function(a){return a.ok;}).length;
    $("resScore").textContent=ok;
    $("resTotal").textContent="／ "+state.answers.length+"問";
    var miss=state.answers.filter(function(a){ return !a.ok; });
    var ul=$("resMiss"); ul.innerHTML="";
    $("resMissCard").classList.toggle("hide", miss.length===0);
    miss.forEach(function(a){
      var li=document.createElement("li");
      li.innerHTML='<div class="s">セクション'+a.sec+'　例文'+a.sen+
        (a.word?'　単語No '+esc(a.word):'')+'</div>'+
        '<div class="yours">入力: '+esc(a.typed||"（未入力）")+'</div>'+
        '<div class="ans">正解: '+esc(a.correct)+'</div>';
      ul.appendChild(li);
    });
  }
  show("scResult","結果","",null);
}
var finishedSecs=[];

/* ---------- CSV ---------- */
function csvCell(s){
  s=String(s==null?"":s);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function buildCSV(secs){
  var lines=["日付,回目,モード,セクション,例文No,単語No,正誤,入力した答え,正しい答え"];
  secs.forEach(function(sec){
    sectionLog(sec).forEach(function(sess,idx){
      var mode=sess.mode||"fill";
      sess.items.forEach(function(it){
        lines.push([sess.date, sess.attempt||(idx+1), MODE_NAME[mode]||mode, sec, it.sen,
          csvCell(it.word||""), it.ok?"○":"×", csvCell(it.typed), csvCell(it.correct)].join(","));
      });
    });
  });
  return lines.join("\r\n");
}
function secTag(secs){
  var s=secs.slice().sort(function(a,b){return a-b;}), cont=true, i;
  for(i=1;i<s.length;i++) if(s[i]!==s[i-1]+1) cont=false;
  return (s.length>1&&cont) ? pad2(s[0])+"-"+pad2(s[s.length-1]) : s.map(pad2).join("_");
}
function downloadCSV(secs){
  if(!secs.length) return;
  var blob=new Blob(["\uFEFF"+buildCSV(secs)],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="result_section"+secTag(secs)+"_"+stamp()+".csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

/* ---------- 学習記録画面 ---------- */
function buildRecords(){
  var host=$("recList"); host.innerHTML=""; var any=false, n;
  for(n=1;n<=MAX_SECTION;n++){
    var log=sectionLog(n);
    if(!log.length) continue;
    any=true;
    (function(sec,log){
      var box=document.createElement("div");
      box.style.borderTop="1px solid var(--line)"; box.style.padding="10px 0";
      var counts={};
      log.forEach(function(s){ var m=s.mode||"fill"; counts[m]=(counts[m]||0)+1; });
      var parts=[];
      Object.keys(counts).forEach(function(m){ parts.push(MODE_NAME[m]+" "+counts[m]+"回"); });
      box.innerHTML="<strong>セクション"+sec+"</strong> <span class='cnt'>"+parts.join("　")+"</span>";
      var row=document.createElement("div"); row.className="row"; row.style.marginTop="8px";
      var b1=document.createElement("button");
      b1.className="btn ghost"; b1.textContent="CSVで保存";
      b1.onclick=function(){ downloadCSV([sec]); };
      var b2=document.createElement("button");
      b2.className="btn ghost"; b2.style.color="var(--red)"; b2.textContent="記録を削除";
      b2.onclick=function(){
        if(confirm("セクション"+sec+"の記録をすべて削除しますか？")){
          localStorage.removeItem(LS_LOG+sec); buildRecords();
        }
      };
      row.appendChild(b1); row.appendChild(b2); box.appendChild(row); host.appendChild(box);
    })(n,log);
  }
  $("noRec").classList.toggle("hide", any);
}

/* ---------- 苦手問題・定期テスト ---------- */
function startWeak(){
  var mode=state.mode, w=weakList(mode);
  if(!w.length) return;
  var secs=[], seen={};
  w.forEach(function(x){ if(!seen[x.sec]){ seen[x.sec]=1; secs.push(x.sec); } });
  loadingOn(true);
  Promise.all(secs.map(function(s){ return loadSection(s).catch(function(){ return []; }); })).then(function(list){
    var all=[]; list.forEach(function(x){ all=all.concat(x); });
    if(mode==="fill"){
      loadingOn(false);
      var map={};
      all.forEach(function(it){ map[weakKeyOf("fill",it.sec,it.word)]=it; });
      var picked=[];
      w.forEach(function(x){ if(map[x.k]) picked.push(map[x.k]); });
      if(!picked.length){ alert("もとのCSVが見つかりませんでした。"); return; }
      if(state.order==="rand") shuffle(picked);
      startFill(picked,"苦手問題",secs,startWeak);
    }else{
      var sm={};
      sentencesOf(all).forEach(function(s){ sm[weakKeyOf("dict",s.sec,s.sen)]=s; });
      var pick=[];
      w.forEach(function(x){ if(sm[x.k]) pick.push(sm[x.k]); });
      filterWithAudio(pick).then(function(ok){
        loadingOn(false);
        if(!ok.length){ alert("音声のある苦手問題がありません。"); return; }
        if(state.order==="rand") shuffle(ok);
        startAudioMode(ok,"苦手問題",secs,startWeak);
      });
    }
  }).catch(function(){ loadingOn(false); alert("読み込みに失敗しました。"); });
}
function startTest(secs){
  loadingOn(true);
  Promise.all(secs.map(loadSection)).then(function(list){
    var all=[]; list.forEach(function(x){ all=all.concat(x); });
    var label="定期テスト セクション"+secTag(secs).replace("-","〜").replace(/_/g,"・");
    var again=function(){ startTest(secs); };
    if(state.mode==="fill"){
      loadingOn(false);
      if(!all.length){ alert("問題が見つかりませんでした。"); return; }
      startFill(all,label,secs,again);
    }else{
      filterWithAudio(sentencesOf(all)).then(function(ok){
        loadingOn(false);
        if(!ok.length){ alert("音声のある例文がありません。"); return; }
        if(state.order==="rand") shuffle(ok);
        startAudioMode(ok,label,secs,again);
      });
    }
  }).catch(function(e){ loadingOn(false); alert(e.message||"読み込みに失敗しました。"); });
}

/* ---------- 操作 ---------- */
$("modeGrid").addEventListener("click",function(ev){
  var b=ev.target.closest(".mode"); if(!b) return;
  state.mode=b.dataset.mode; refreshMenu();
});
$("orderSeg").addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b) return;
  Array.prototype.forEach.call(this.children,function(x){ x.classList.remove("on"); });
  b.classList.add("on"); state.order=b.dataset.order;
});
$("secAcc").onclick=function(){
  var open=$("secBody").hidden;
  $("secBody").hidden=!open;
  this.classList.toggle("open",open);
  this.setAttribute("aria-expanded", open?"true":"false");
  localStorage.setItem(LS_ACC, open?"1":"0");
};
$("toTest").onclick=function(){
  if(!state.sections.length){ alert("まだセクションのCSVがありません。"); return; }
  show("scTest","定期テスト",MODE_NAME[state.mode],goMenu);
};
$("toWeak").onclick=startWeak;
$("toRecords").onclick=function(){ buildRecords(); show("scRecords","学習記録","",goMenu); };
$("applyRange").onclick=function(){
  var f=parseInt($("rangeFrom").value,10), t=parseInt($("rangeTo").value,10), x;
  if(isNaN(f)||isNaN(t)){ alert("開始と終了の番号を入力してください。"); return; }
  if(f>t){ x=f; f=t; t=x; }
  Array.prototype.forEach.call($("testChecks").querySelectorAll("input"),function(c){
    var v=parseInt(c.value,10); c.checked=(v>=f&&v<=t);
  });
};
$("checkAll").onclick=function(){ Array.prototype.forEach.call($("testChecks").querySelectorAll("input"),function(c){c.checked=true;}); };
$("checkNone").onclick=function(){ Array.prototype.forEach.call($("testChecks").querySelectorAll("input"),function(c){c.checked=false;}); };
$("startTest").onclick=function(){
  var secs=[];
  Array.prototype.forEach.call($("testChecks").querySelectorAll("input"),function(c){ if(c.checked) secs.push(parseInt(c.value,10)); });
  if(!secs.length){ alert("セクションを1つ以上選択してください。"); return; }
  secs.sort(function(a,b){return a-b;});
  startTest(secs);
};

$("checkBtn").onclick=gradeFill;
$("nextBtn").onclick=nextQuestion;
$("quitBtn").onclick=function(){ if(confirm("練習を中断してメニューに戻りますか？")) goMenu(); };

$("pNext").onclick=nextQuestion;
$("pQuit").onclick=function(){ stopAudio(); if(confirm("中断してメニューに戻りますか？")) goMenu(); };
$("pToggle").onclick=function(){
  if(state.mode==="listen") state.showJa=!state.showJa;
  else state.shadowEn=!state.shadowEn;
  applyPlayVisibility();
};
function bindSpeed(id){
  $(id).addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    state.speed=parseFloat(b.dataset.sp);
    localStorage.setItem(LS_SPEED,state.speed);
    if(player) player.playbackRate=state.speed;
    markSpeed($("pSpeed")); markSpeed($("dSpeed"));
  });
}
bindSpeed("pSpeed"); bindSpeed("dSpeed");

$("dCheck").onclick=gradeDict;
$("dNext").onclick=nextQuestion;
$("dQuit").onclick=function(){ stopAudio(); if(confirm("中断してメニューに戻りますか？")) goMenu(); };

$("saveCsvBtn").onclick=function(){ downloadCSV(finishedSecs); };
$("againBtn").onclick=function(){ if(state.lastSetup) state.lastSetup(); };
$("homeBtn").onclick=goMenu;

findSections().then(function(list){
  state.sections=list;
  $("menuLoading").classList.add("hide");
  $("menuBody").classList.remove("hide");
  buildMenu();
}).catch(function(){
  $("menuLoading").textContent="読み込みに失敗しました。ページを開きなおしてください。";
});
</script>
